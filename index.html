<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexo Play</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="rotate" role="alert"><div><i>⟳</i><p>Gire o aparelho para a horizontal</p><small>O Nexo Play funciona somente em landscape.</small></div></div>
<div id="app">
<canvas id="game" aria-label="Área de teste de comandos"></canvas>
<div id="pad"><span id="hud"></span></div>
<div id="ctl"><div class="in">
 <div class="hide">
  <button class="a btn sh d l2" style="left:11%;top:17%" data-b="l2"><b>L2</b></button>
  <button class="a btn sh d l1" style="left:19%;top:29%" data-b="l1"><b>L1</b></button>
  <button class="a btn sh d r2" style="left:89%;top:17%" data-b="r2"><b>R2</b></button>
  <button class="a btn sh d r1" style="left:81%;top:29%" data-b="r1"><b>R1</b></button>
  <button class="a btn dp" style="left:14%;top:44%" data-b="up" aria-label="Cima">▲</button>
  <button class="a btn dp left" style="left:7.5%;top:60%" data-b="left" aria-label="Esquerda">◀</button>
  <button class="a btn dp right" style="left:20.5%;top:60%" data-b="right" aria-label="Direita">▶</button>
  <button class="a btn dp down" style="left:14%;top:76%" data-b="down" aria-label="Baixo">▼</button>
  <button class="a btn fc" style="left:86%;top:48%" data-b="triangle" aria-label="Triângulo">△</button>
  <button class="a btn fc" style="left:78%;top:62%" data-b="square" aria-label="Quadrado">□</button>
  <button class="a btn fc" style="left:94%;top:62%" data-b="circle" aria-label="Círculo">○</button>
  <button class="a btn fc" style="left:86%;top:76%" data-b="cross" aria-label="X">×</button>
  <div class="a stick" style="left:31%;top:76%" data-s="l" aria-label="Analógico esquerdo"><div class="knob"></div></div>
  <div class="a stick" style="left:69%;top:76%" data-s="r" aria-label="Analógico direito"><div class="knob"></div></div>
  <button class="a btn mini" style="left:44%;top:93%" data-b="options" aria-label="Opções">Opç.</button>
  <button class="a btn ps" style="left:50%;top:92%" data-b="ps" aria-label="PS">PS</button>
  <button class="a btn mini" style="left:56%;top:93%" data-b="mic" aria-label="Microfone">Mic</button>
 </div>
 <button class="a btn mini" id="gear" style="left:4%;top:93%;touch-action:manipulation" aria-label="Ajustes">⚙</button>
 <button class="a btn mini" id="tog" style="left:96%;top:93%;touch-action:manipulation" aria-label="Ocultar controles">✕</button>
</div></div>
</div>
<div id="panel" hidden role="dialog" aria-modal="true" aria-label="Ajustes"><div class="box">
 <div class="row"><b>Ajustes</b><button class="chip" id="close">Fechar</button></div>
 <label class="row"><span>Mostrar controles</span><input type="checkbox" id="o-vis"></label>
 <label class="row"><span>Transparência</span><input type="range" id="o-op" min=".2" max="1" step=".05"></label>
 <label class="row"><span>Tamanho dos botões</span><input type="range" id="o-sz" min=".7" max="1.3" step=".05"></label>
 <label class="row"><span>Vibração</span><input type="checkbox" id="o-vib"></label>
 <button class="chip" id="reset">Restaurar padrões</button>
 <details><summary>Teclado para testes</summary>Setas ou WASD: direcional. J ×, K ○, I △, L □. Q L1, 1 L2, E R1, 3 R2. Enter Opções, P PS, M Mic, H oculta controles.</details>
</div></div>
<script src="app.js"></script>
</body>
</html>
